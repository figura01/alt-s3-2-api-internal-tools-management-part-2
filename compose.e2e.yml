services:
  postgres-e2e:
    image: postgres:15
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: internal_tools_e2e
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U e2e -d internal_tools_e2e']
      interval: 2s
      timeout: 5s
      retries: 15
